[project]
name = "Federal Reserve Yield Curve"
description = "Treasury Zero-Coupon Yield Curve from the Federal Reserve"
contributors = [
    "Jeremiah Bejarano",
]
repo_url = "https://github.com/ftsfr/fed_yield_curve"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]

[notebooks.summary_fed_yield_curve_ipynb]
name = "summary_fed_yield_curve_ipynb"
description = "Summary statistics and visualization of Federal Reserve yield curve data"
path = "_output/summary_fed_yield_curve_ipynb.ipynb"
publishable = true

[notebooks.gsw_crsp_replication_ipynb]
name = "gsw_crsp_replication_ipynb"
description = "Replication of GSW (2007) Figures 1, 2, and 6 using CRSP Treasury data (optional; requires WRDS_USERNAME)"
path = "_output/gsw_crsp_replication_ipynb.ipynb"
publishable = true

[dataframes.ftsfr_treas_yield_curve_zero_coupon]
name = "ftsfr_treas_yield_curve_zero_coupon"
description = "Treasury Zero-Coupon Yield Curve from the Federal Reserve"
sources = [
    "federal_reserve",
]
providers = [
    "Federal Reserve",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://www.federalreserve.gov/data/nominal-yield-curve.htm",
]
tags = [
    "yield_curve",
    "treasury",
    "interest_rates",
]
access_types = [
    "Public",
]
license = "Public"
restrictions = "No"
pull_method = "Downloaded from Federal Reserve website"
path = "./_data/ftsfr_treas_yield_curve_zero_coupon.parquet"
date_col = "ds"
docs = """
## Treasury Zero-Coupon Yield Curve

This dataset contains daily zero-coupon Treasury yields estimated using the
Gurkaynak, Sack, and Wright (2007) model.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Tenor identifier (e.g., SVENY01 = 1 year, SVENY10 = 10 years) |
| ds | Date |
| y | Yield (%) |

### Tenors

Yields are available for maturities from 1 to 30 years (SVENY01 to SVENY30).

### Reference

Gurkaynak, Refet S., Brian Sack, and Jonathan H. Wright. \"The US Treasury yield curve: 1961 to the present.\"
Journal of Monetary Economics 54.8 (2007): 2291-2304.
"""

[charts.yield_curve_replication]
name = "Treasury Zero-Coupon Yield Curve"
description = "Zero-coupon Treasury yields from Federal Reserve using Gurkaynak, Sack, Wright (2007) methodology"
dataframe = "ftsfr_treas_yield_curve_zero_coupon"
path = "./_output/yield_curve_replication.html"
tags = [
    "yield_curve",
    "treasury",
    "interest_rates",
    "replication",
]
publications = [
    "Gurkaynak, Sack, and Wright (2007) - The U.S. Treasury yield curve: 1961 to the present",
]
docs = """
## Treasury Zero-Coupon Yield Curve

Daily zero-coupon Treasury yields estimated using GSW methodology.

### Tenors

SVENY01 to SVENY30 (1-year to 30-year maturities)

### Reference

Gurkaynak, Sack, and Wright (2007)
"""
